<title>万象牌</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#f2ecdc;
  --bg2:#ece4cf;
  --panel:#ebe3cd;
  --panel2:#e2d8bc;
  --paper:#2a2520;
  --paper2:#4a4438;
  --paper3:#7a7263;
  --card:#fffdf8;
  --cardline:#d8cdb0;
  --ink:#2a2520;
  --ink2:#6b6252;
  --cinnabar:#b8422e;
  --cinnabar2:#cc5540;
  --gold:#9a7b3a;
  --jade:#4a7a66;
  --line:rgba(42,37,32,.12);
  --line2:rgba(42,37,32,.22);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
/* 暗色模式：朱砂墨色主题 */
html.dark{
  --bg:#191512;
  --bg2:#211b16;
  --panel:#241e18;
  --panel2:#2d251d;
  --paper:#e9e0cf;
  --paper2:#c8bca8;
  --paper3:#a3947d;
  --card:#2e271f;
  --cardline:#4a3f32;
  --ink:#ece3d1;
  --ink2:#b6a88f;
  --cinnabar:#c25a43;
  --cinnabar2:#d4745c;
  --gold:#c9a35c;
  --jade:#5d9a81;
  --line:rgba(233,224,207,.12);
  --line2:rgba(233,224,207,.22);
}
html.dark body{background:radial-gradient(1200px 600px at 15% -10%, rgba(194,90,67,.07), transparent 60%),radial-gradient(900px 500px at 110% 10%, rgba(201,163,92,.08), transparent 55%),var(--bg)}
html.dark .seal{color:#f5eedd}
html.dark .cardback{background:linear-gradient(135deg,#8f3a28 0%,#6d2417 100%)!important}
html.dark .jgcell.center{border-color:var(--gold)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(184,66,46,.05), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(154,123,58,.06), transparent 55%),
    var(--bg);
  color:var(--paper);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:repeating-linear-gradient(0deg, rgba(42,37,32,.015) 0 1px, transparent 1px 3px);
}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1}

/* ===== 头部 ===== */
header{padding:34px 0 22px;display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--cinnabar)}
.seal{
  width:52px;height:52px;flex:none;
  background:var(--cinnabar);color:#f5eedd;
  font-family:var(--serif);font-weight:900;font-size:30px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--cinnabar), 0 0 0 4px rgba(184,66,46,.2);
  transform:rotate(-2deg);
}
.ht h1{font-family:var(--serif);font-weight:900;font-size:31px;letter-spacing:6px;color:var(--ink)}
.ht p{font-size:12px;color:var(--paper3);letter-spacing:3px;margin-top:4px}

/* ===== 标签页 ===== */
nav{position:sticky;top:0;z-index:50;display:flex;gap:4px;margin:22px 0 26px;border-bottom:1px solid var(--line);background:var(--bg);padding:8px 0}
nav button{
  font-family:var(--serif);font-size:16px;letter-spacing:6px;color:var(--paper3);
  background:none;border:none;padding:10px 18px 12px;cursor:pointer;position:relative;transition:color .2s;
}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink)}
nav button.on::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--cinnabar);
}
nav button .cnt{
  font-family:var(--sans);font-size:10px;letter-spacing:0;background:var(--panel2);
  border-radius:10px;padding:1px 6px;margin-left:6px;color:var(--paper3);vertical-align:2px;
}

/* ===== 通用 ===== */
section{display:none}
section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(42,37,32,.06)}
.panel h2{
  font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:3px;color:var(--ink);
  display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.panel h2::before{content:"";width:4px;height:16px;background:var(--cinnabar);flex:none}
.panel h2 .hint{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--paper3);letter-spacing:1px}
label{display:block;font-size:12px;color:var(--paper3);margin:10px 0 6px;letter-spacing:2px}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
  font-family:var(--sans);font-size:14px;padding:9px 12px;border-radius:6px;outline:none;transition:border .2s;
}
input:focus,textarea:focus,select:focus{border-color:var(--cinnabar)}
textarea{resize:vertical;min-height:64px;line-height:1.7}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--paper3) 50%),linear-gradient(135deg,var(--paper3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
button{
  font-family:var(--sans);font-size:13px;letter-spacing:2px;color:var(--ink);
  background:var(--card);border:1px solid var(--line2);border-radius:6px;
  padding:9px 18px;cursor:pointer;transition:all .18s;
}
button:hover{background:var(--panel2);border-color:var(--gold)}
button.primary{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
button.primary:hover{background:var(--cinnabar2);border-color:var(--cinnabar2)}
button.ghost{background:transparent}
button.danger{color:#b8422e;border-color:rgba(184,66,46,.35)}
button.sm{padding:5px 10px;font-size:12px;letter-spacing:1px}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
.row .grow2{flex:2}
.row .no-grow{flex:0}
.muted{color:var(--paper3);font-size:12px;letter-spacing:1px}

/* 关于弹窗：点击左上角「爻」打开 */
.mask{position:fixed;inset:0;background:rgba(42,37,32,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.about{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:26px 22px 18px;width:100%;max-width:320px;position:relative;box-shadow:0 12px 40px rgba(42,37,32,.2)}
.about h3{font-family:var(--serif);font-size:20px;letter-spacing:6px;color:var(--ink);margin-bottom:6px}
.about-tip{font-size:11px;color:var(--paper3);margin-bottom:16px;letter-spacing:1px}
.about-close{position:absolute;top:8px;right:10px;border:none;background:none;font-size:22px;line-height:1;color:var(--paper3);cursor:pointer;padding:6px 10px}
.about-close:hover{color:var(--cinnabar)}
.about-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;background:var(--card)}
.about-item:hover{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar)}
.about-key{font-family:var(--serif);font-size:15px;letter-spacing:2px;color:var(--ink)}
.about-val{font-family:var(--sans);font-size:13px;color:var(--cinnabar);letter-spacing:1px}
.about-cpy{font-size:10px;color:var(--paper3);margin-left:8px}

/* ===== 牌库选择器 ===== */
.decktabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.decktab{
  padding:7px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px;
  cursor:pointer;font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--paper3);transition:all .15s;
}
.decktab:hover{border-color:var(--cinnabar);color:var(--ink)}
.decktab.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.decktab .dcnt{font-family:var(--sans);font-size:10px;margin-left:4px;opacity:.75}
.decktab.add{background:transparent;border-style:dashed;color:var(--paper3)}
.decktab.add:hover{color:var(--cinnabar);border-color:var(--cinnabar)}

/* ===== 牌库卡片 ===== */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{
  background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:12px 12px 10px;cursor:pointer;transition:all .18s;position:relative;
  box-shadow:0 1px 3px rgba(42,37,32,.06);
}
.pcard:hover{border-color:var(--cinnabar);transform:translateY(-2px);box-shadow:0 4px 12px rgba(42,37,32,.1)}
.pcard .num{
  position:absolute;top:8px;right:10px;font-family:var(--serif);font-size:11px;color:var(--gold);
}
.pcard .nm{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:3px;color:var(--ink)}
.pcard .mg{font-size:11px;color:var(--paper3);line-height:1.6;margin-top:6px;letter-spacing:.5px}
.pcard.editing{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar)}
.empty{padding:30px 0;text-align:center;color:var(--paper3);font-size:13px;letter-spacing:2px}
/* 牌库视图切换：列表 */
.cardgrid.list{display:block}
.cardgrid.list .pcard{display:flex;align-items:center;gap:12px;padding:10px 14px}
.cardgrid.list .pcard:hover{transform:none}
.cardgrid.list .pcard .num{position:static;flex:0 0 40px;text-align:center;background:var(--cardline);border-radius:6px;padding:4px 0;color:var(--gold)}
.cardgrid.list .pcard .nm{flex:0 0 88px;letter-spacing:2px}
.cardgrid.list .pcard .mg{flex:1;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 录入区折叠面板 */
.foldpanel{border:1px solid var(--line);border-radius:10px;margin-bottom:18px;background:var(--panel);box-shadow:0 1px 4px rgba(42,37,32,.06)}
.foldpanel:not([open])>*:not(summary){display:none!important}
.foldpanel>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:16px 20px;font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:2px;color:var(--ink);transition:color .18s}
.foldpanel>summary::-webkit-details-marker{display:none}
.foldpanel>summary::after{content:'▸';margin-left:auto;color:var(--paper3);font-size:14px;transition:transform .18s}
.foldpanel[open]>summary::after{transform:rotate(90deg)}
.foldpanel>summary:hover{color:var(--cinnabar)}
.foldpanel .foldbody{padding:0 20px 20px}

/* ===== 牌阵 ===== */
.spreadlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.spcard{
  background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:14px;cursor:pointer;transition:all .18s;
  box-shadow:0 1px 3px rgba(42,37,32,.06);
}
.spcard:hover{border-color:var(--cinnabar)}
.spcard.on{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar)}
.spcard .nm{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:2px;color:var(--ink)}
.spcard .ds{font-size:11px;color:var(--paper3);margin-top:4px;letter-spacing:1px}
.spcard .pos{font-size:11px;color:var(--gold);margin-top:8px;letter-spacing:.5px;line-height:1.8}
/* 牌阵摆位示意图 */
.spprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.spprev .spp{flex:0 0 auto;min-width:30px;height:22px;line-height:22px;text-align:center;font-size:10px;letter-spacing:0;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow:hidden}
.spprev .spp.more{color:var(--gold);border-style:dashed}
.spprev.jg9{display:grid;grid-template-columns:repeat(3,30px);gap:4px}
.spprev .spp.mid{border-color:var(--gold);color:var(--gold);font-weight:700}
/* 普通牌阵点位缩略图：固定6列圆点，首点位朱砂高亮 */
.spprev.grid{display:grid;grid-template-columns:repeat(6,14px);gap:5px;margin-top:10px}
.spprev.grid .spp{flex:none;min-width:0;width:14px;height:14px;padding:0;line-height:1;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.spprev.grid .spp.first{background:var(--cinnabar);border-color:var(--cinnabar)}
.spprev.grid .spp.more{background:transparent;border-color:transparent;display:none}
/* 行分组牌阵小预览（流年/十二宫/卦主加发展/自定义行布局） */
.spprev.rlg{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:2px 0}
.spprev.rlg .spr{display:flex;gap:4px;justify-content:center}
.spprev.rlg .spr i{display:inline-block;width:16px;height:9px;border:1px solid var(--line2);border-radius:2px;background:var(--panel2)}
.custlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.custcard{background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(42,37,32,.06)}
.custcard .nm{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:2px;color:var(--ink)}
.custcard .ds{font-size:11px;color:var(--paper3);margin-top:4px;line-height:1.7;letter-spacing:.5px}
.custcard .ops{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

/* ===== 占卜 ===== */
.qinput{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.qinput>div{flex:1;min-width:220px}
.modebox{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.modebox.show{display:block}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;width:fit-content;flex-wrap:wrap;background:var(--card)}
.seg button{border:none;border-radius:0;padding:8px 18px;background:transparent;color:var(--paper3)}
.seg button.on{background:var(--cinnabar);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  min-width:38px;text-align:center;padding:7px 10px;font-family:var(--serif);font-size:14px;
  background:var(--card);border:1px solid var(--cardline);border-radius:6px;cursor:pointer;color:var(--paper3);transition:all .15s;
}
.chip:hover{border-color:var(--cinnabar)}
.chip.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.drawbtn{
  width:100%;margin-top:20px;padding:14px;font-family:var(--serif);font-size:17px;letter-spacing:8px;
  background:var(--cinnabar);border:none;border-radius:8px;color:#fff;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 16px rgba(184,66,46,.25);
}
.drawbtn:hover{background:var(--cinnabar2);box-shadow:0 6px 24px rgba(184,66,46,.35)}
/* 占卜首屏居中：起卦区垂直居中（大屏限制高度，避免占满） */
#view-draw .panel:first-child{display:flex;flex-direction:column;justify-content:center;min-height:min(52vh,430px)}
@media (max-width:640px){
  #view-draw .panel:first-child{min-height:min(46vh,360px)}
  .cardgrid.list .pcard .nm{flex:0 0 72px;font-size:15px}
  .cardgrid.list .pcard .mg{white-space:normal}
}
/* 抽牌选项：动画/音效开关 */
.optsrow{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.optsrow .opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--paper3);cursor:pointer;letter-spacing:1px}
/* 抽牌设置：使用牌库多选 */
.deckpick{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 10px;background:var(--paper);border:1px dashed var(--line);border-radius:10px}
.deckpick .opt{font-size:13px;letter-spacing:0;gap:4px;white-space:nowrap}
.deckpick .opt.curdeck{color:var(--cinnabar);font-weight:700}
/* 结果卡上的来源库小标签（多库混合时显示） */
.cfrom{display:inline-block;margin:0 6px 0 2px;padding:1px 6px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--ink2);vertical-align:1px;white-space:nowrap}
.optsrow .opt input{width:16px;height:16px;accent-color:var(--cinnabar)}

/* 抽牌设置折叠区：默认收起，点开才露出牌库/牌阵/九宫/开关 */
.drawsetup{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.drawsetup:not([open])>*:not(summary){display:none!important}
.drawsetup summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--paper3);letter-spacing:1px;padding:7px 14px;border:1px solid var(--line2);border-radius:999px;background:var(--card);transition:all .18s}
.drawsetup summary::-webkit-details-marker{display:none}
.drawsetup summary::after{content:'▾';font-size:10px;color:var(--paper3)}
.drawsetup[open] summary{color:var(--cinnabar);border-color:var(--cinnabar)}
.drawsetup[open] summary::after{content:'▴'}
.drawsetup .modebox{border-top:none;margin-top:14px}
.drawsetup .qinput{margin-top:12px}

/* 底部悬浮操作条（已撤销，恢复顶部操作栏） */
.resultops{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.resultops .sm{min-height:38px;padding:7px 14px}

/* 牌库管理 ⋯ 菜单 */
.deckops{display:flex;align-items:center;gap:10px;margin-top:10px}
.mini-menu{position:relative}
.mini-menu summary{list-style:none;cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:8px;color:var(--paper3);font-size:18px;letter-spacing:0;background:var(--card);transition:all .18s}
.mini-menu summary::-webkit-details-marker{display:none}
.mini-menu summary:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.mini-menu[open] summary{border-color:var(--cinnabar);color:var(--cinnabar)}
.mini-menu .menu{position:absolute;left:0;top:44px;z-index:40;background:var(--card);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(42,37,32,.16);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:170px}
.mini-menu .menu .sm{justify-content:flex-start;text-align:left}
.drawbtn:active{transform:scale(.99)}
.result{margin-top:24px;scroll-margin-top:64px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px solid var(--cinnabar);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.rhead .q{font-family:var(--serif);font-size:15px;color:var(--paper3);letter-spacing:1px}
.rhead .cardsline{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:6px;color:var(--ink)}
.rline{display:flex;gap:14px;align-items:stretch;margin-bottom:12px;flex-wrap:wrap}
.rline+.rline{border-top:1px dashed var(--line);padding-top:14px}
.rpos{flex:0 0 150px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--cinnabar);border-radius:8px;padding:12px}
.rpos .pn{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:2px;color:var(--ink)}
.rpos .pm{font-size:11px;color:var(--paper3);margin-top:5px;line-height:1.6}
/* 结果牌卡：同一位置多张牌等宽排列（单张占满，多张平分，超宽自动换行） */
.rcards{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:12px}
.rcards .rcard{flex:1 1 190px;min-width:0}
/* 行分组布局：每排一个标签 + 一排牌（流年/十二宫/卦主加发展/自定义行布局） */
.rrows{display:flex;flex-direction:column;gap:0;margin-top:14px}
.rrow{display:flex;gap:12px;align-items:stretch;margin-bottom:14px}
.rrow+.rrow{border-top:1px dashed var(--line);padding-top:14px}
.rrow .rrlab{flex:0 0 62px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:2px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;text-align:center;padding:4px}
.rrow .rcards{flex:1;min-width:0}
.rrow .rcards .rcard{flex:1 1 150px;min-width:0}
/* 牌面方向小箭头 */
.dir{display:inline-block;font-size:12px;font-weight:900;color:var(--gold);margin-left:3px;letter-spacing:0;font-family:var(--sans);vertical-align:1px}
.rcard{
  flex:1;min-width:0;background:var(--card);color:var(--ink);border-radius:8px;padding:18px 14px;position:relative;
  box-shadow:0 2px 10px rgba(42,37,32,.1);border:1px solid var(--cardline);
}
.rcard.with-buibu{padding-bottom:46px}
/* 牌名统一排版：数字固定列宽、牌名右对齐、释义左对齐 */
.rcard .cardhead,.rcell .cardhead{display:flex;align-items:baseline;gap:6px}
.rcard .rnum,.rcell .rnum{position:static;flex:0 0 28px;text-align:center;font-family:var(--serif);font-size:12px;color:var(--cinnabar);font-weight:700}.rcard .rn,.rcell .rn{flex:1;text-align:right;font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:4px}
.rcard .rm,.rcell .rm{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.7;letter-spacing:.5px;text-align:left}
/* 大牌阵（12+位置）6列等宽网格：每格牌名+数字，点开看详解 */
.rgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.rgrid.rgrid-2{grid-template-columns:repeat(2,1fr)!important}
.rgrid.rgrid-1{grid-template-columns:1fr!important}
.rgrid.cols3{grid-template-columns:repeat(3,1fr)}
.rgrid.cols9{grid-template-columns:repeat(9,1fr);gap:5px}
/* 紫微十二宫：外圈方框十二宫 + 中宫空白 */
.zwgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.zwcell{border:1px solid var(--cardline);border-radius:6px;padding:4px;background:var(--cardbg);min-height:0;display:flex;flex-direction:column;gap:4px}
.zwcell .zwname{font-family:var(--serif);font-size:12px;font-weight:700;color:var(--cinnabar);text-align:center;letter-spacing:1px;line-height:1.4}
.dong-hint{font-weight:400;color:var(--paper3);font-size:12px;margin-left:6px}
html.dark .dong-hint{color:var(--paper3)}
/* 暗色下紫微宫格边框加深，宫界更清楚 */
html.dark .zwgrid .zwcell{border-color:#6d5a40}
html.dark .zwgrid .zwcenter{border-color:#6d5a40}
.zwcell .zwcards{display:flex;flex-direction:column;gap:4px;flex:1}
.zwgrid .zwcenter{border:1px dashed var(--cardline);border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--cardbg);min-height:0}
.zwgrid .zwcenter .zwc-txt{font-family:var(--serif);font-size:14px;letter-spacing:6px;color:var(--paper3);text-indent:6px}
.zwgrid .rcell{padding:3px 5px;min-height:0;border-radius:6px;box-shadow:none}
.zwgrid .rcell.closed{min-height:0}
.zwgrid .rcell.closed .cardback{min-height:52px;height:52px;font-size:15px}
.zwgrid .rcell .cb-pos{display:none}
.zwgrid .rcell .cardhead{gap:3px}
.zwgrid .rcell .rnum{flex:0 0 18px;font-size:11px}
.zwgrid .rcell .rn{font-size:12px;letter-spacing:0;font-weight:700}
.zwgrid .rcell .rm{font-size:11px;line-height:1.5;margin-top:2px}
.zwgrid .rcell .buibu.oncard{display:none}
.rgrid.cols9 .rcell{min-height:64px;padding:5px 1px}
.rgrid.cols9 .rnum{display:none}
.rgrid.cols9 .rn{font-size:11px;letter-spacing:0;white-space:normal;line-height:1.3;text-align:center}
.rgrid.cols9 .rposname{font-size:10px;margin-bottom:3px}
.rgrid.cols9 .rm{font-size:11px}
.season-vert{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.seas-block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.seas-head{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--cinnabar);letter-spacing:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.monrow{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.monrow:last-child{margin-bottom:0}
.mon{flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.moncards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.season-vert .rcell{min-height:62px;padding:6px 2px;background:var(--card);border:1px solid var(--cardline);border-radius:8px;cursor:pointer;text-align:center}
.season-vert .rcell:hover{border-color:var(--cinnabar)}
.season-vert .rnum{display:none}
.season-vert .rn{font-size:12px;letter-spacing:0;white-space:normal;line-height:1.3;text-align:center;justify-content:center}
.season-vert .rposname{font-size:10px;margin-bottom:3px}
.season-vert .rm{font-size:11px}
.season-vert .rcell .buibu.oncard{display:none}
.rposname{font-size:11px;font-weight:700;color:var(--cinnabar);letter-spacing:1px;text-align:center;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcell{
  background:var(--card);color:var(--ink);border-radius:8px;padding:10px 8px 36px;position:relative;min-height:78px;cursor:pointer;
  box-shadow:0 2px 8px rgba(42,37,32,.08);border:1px solid var(--cardline);transition:all .18s;
}
.rcell:hover{border-color:var(--cinnabar)}
.rcell .cardhead{align-items:center;flex-wrap:nowrap}
.rcell .rn{font-size:13px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcell .rnum{flex:0 0 22px;font-size:11px}
.rcell .rm{display:none;font-size:12px}
.rcell.open .rm{display:block}
.rcell.open{min-height:auto}
.rcell .cardback{width:100%;height:56px}
.rcell .buibu.oncard{bottom:6px;left:6px;right:6px;flex-wrap:nowrap;display:none}
.rcell.open .buibu.oncard{display:flex}
.rcell .buibu.oncard button{font-size:11px;padding:3px 8px;white-space:nowrap;flex:0 0 auto;align-self:center}
/* 移动端网格 4 列，保证每格可点 */
@media (max-width:640px){.rgrid{grid-template-columns:repeat(4,1fr)}.rgrid.cols3{grid-template-columns:repeat(3,1fr)}
.rgrid.cols9{grid-template-columns:repeat(9,1fr);gap:5px}
.rgrid.cols9 .rcell{min-height:64px;padding:5px 1px}
.rgrid.cols9 .rnum{display:none}
.rgrid.cols9 .rn{font-size:11px;letter-spacing:0;white-space:normal;line-height:1.3;text-align:center}
.rgrid.cols9 .rposname{font-size:10px;margin-bottom:3px}
.rgrid.cols9 .rm{font-size:11px}
.season-vert{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.seas-block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.seas-head{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--cinnabar);letter-spacing:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.monrow{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.monrow:last-child{margin-bottom:0}
.mon{flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.moncards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.season-vert .rcell{min-height:62px;padding:6px 2px;background:var(--card);border:1px solid var(--cardline);border-radius:8px;cursor:pointer;text-align:center}
.season-vert .rcell:hover{border-color:var(--cinnabar)}
.season-vert .rnum{display:none}
.season-vert .rn{font-size:12px;letter-spacing:0;white-space:normal;line-height:1.3;text-align:center;justify-content:center}
.season-vert .rposname{font-size:10px;margin-bottom:3px}
.season-vert .rm{font-size:11px}
.season-vert .rcell .buibu.oncard{display:none}}
/* 补抽按钮浮在牌卡底部内侧 */
.buibu.oncard{position:absolute;left:8px;right:8px;bottom:9px;display:flex;gap:6px;align-items:center;justify-content:center;border-top:none;margin:0;padding:0}

/* 结果操作栏 */
.resultops{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* 九宫 —— 罗盘式 */
.jggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;padding:10px;border:1px solid var(--gold);border-radius:10px;background:var(--panel)}
.jgcell{
  background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:12px;cursor:pointer;transition:all .18s;
  box-shadow:0 1px 3px rgba(42,37,32,.06);
}
.jgcell:hover{border-color:var(--cinnabar);transform:translateY(-1px)}
.jgcell.on{border-color:var(--cinnabar);box-shadow:0 0 0 2px var(--cinnabar)}
.jgcell.dim{opacity:.45;filter:saturate(.6)}
.jgcell.center{border-color:var(--gold);border-width:2px}
.jgcell .gn{font-family:var(--serif);font-size:17px;font-weight:900;letter-spacing:2px;color:var(--ink)}
.jgcell .gx{font-size:11px;color:var(--gold);margin-top:2px;letter-spacing:1px}
.jgcell .gcards{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.jgcard{
  background:var(--panel);border-left:3px solid var(--cinnabar);border-radius:4px;padding:5px 8px;font-size:12px;
  display:flex;justify-content:space-between;gap:6px;
}
.jgcard .cn{font-family:var(--serif);font-weight:700;letter-spacing:1px;color:var(--ink)}
.jgcard .cm{color:var(--paper3);font-size:11px;line-height:1.5;text-align:right}
.jgdetail{margin-top:16px;background:var(--card);color:var(--ink);border-radius:8px;padding:16px;display:none;border:1px solid var(--cardline);box-shadow:0 2px 10px rgba(42,37,32,.1)}
.jgdetail.show{display:block}
.jgdetail .dn{font-family:var(--serif);font-size:18px;font-weight:900;letter-spacing:3px;margin-bottom:10px}
.jgdetail .dcard{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:12px}
.jgdetail .dcard .dnum{flex:0 0 26px;font-family:var(--serif);color:var(--cinnabar);font-weight:700}
.jgdetail .dcard .dbody .dname{font-family:var(--serif);font-weight:700;letter-spacing:2px;font-size:15px}
.jgdetail .dcard .dbody .dmean{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.7}
.jgnote{font-size:11px;color:var(--paper3);letter-spacing:1px;margin-top:10px;line-height:1.8}
.buibu{display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.buibu button{background:transparent;color:var(--cinnabar);border:1px solid var(--line2);font-size:10px;padding:2px 10px;border-radius:999px;letter-spacing:1px}
.buibu button:hover{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar)}

/* ===== 页脚提示 ===== */
.footnote{margin-top:26px;padding:14px 16px;border:1px dashed var(--line2);border-radius:8px;font-size:12px;color:var(--paper3);line-height:1.9;letter-spacing:.5px;background:var(--panel)}
.footnote b{color:var(--cinnabar);font-weight:600}

/* toast */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);font-size:13px;padding:10px 20px;border-radius:6px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:99;box-shadow:0 8px 30px rgba(42,37,32,.3);
  font-family:var(--sans);letter-spacing:1px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 页脚 */
.footer{
  margin-top:34px;padding:16px 0 8px;text-align:center;
  border-top:1px solid var(--line);
}
#watermark{
  font-family:var(--serif);font-size:12px;letter-spacing:4px;font-weight:600;
  color:var(--cinnabar);cursor:pointer;user-select:none;transition:opacity .18s;
}
html.dark #watermark{color:#e07b62}
#watermark:hover{opacity:.75}
#watermark::before{
  content:"";display:inline-block;width:7px;height:7px;background:var(--cinnabar);
  border-radius:50%;margin-right:8px;vertical-align:middle;
}
#sponsor{
  font-family:var(--serif);font-size:12px;letter-spacing:3px;font-weight:600;
  color:var(--paper3);margin-top:7px;opacity:.85;user-select:none;
}
/* 暗色模式开关 */
.theme-btn{
  margin-left:auto;flex:none;font-family:var(--sans);font-size:12px;letter-spacing:2px;
  padding:7px 14px;border-radius:6px;background:var(--card);border:1px solid var(--line2);
  color:var(--paper3);cursor:pointer;transition:all .18s;
}
.theme-btn:hover{border-color:var(--gold);color:var(--ink)}

/* ===== 抽牌动画 + 牌卡正反面 ===== */
@keyframes dealIn{from{opacity:0;transform:translateY(20px) rotateX(-15deg)}to{opacity:1;transform:none}}
@keyframes flipCard{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.rcard.dealing{animation:flipCard .5s ease both}
.jgcell.dealing{animation:dealIn .4s ease both}

/* 牌背：朱砂底 + 菱形回纹 + 中心圆点，经典牌背花纹 */
.cardback{
  background:
    radial-gradient(circle at 50% 50%, rgba(245,238,221,.30) 0 3px, transparent 3.5px),
    repeating-linear-gradient(45deg, rgba(245,238,221,.13) 0 2px, transparent 2px 12px),
    repeating-linear-gradient(-45deg, rgba(245,238,221,.13) 0 2px, transparent 2px 12px),
    linear-gradient(135deg,var(--cinnabar) 0%,#8a3020 100%)!important;
  color:#f5eedd!important;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:30px;font-weight:900;letter-spacing:4px;
  min-height:110px;
}
.cardback::after{
  content:"";position:absolute;inset:6px;border:1px solid rgba(245,238,221,.35);border-radius:6px;
  background:repeating-linear-gradient(0deg, transparent 0 8px, rgba(245,238,221,.05) 8px 9px);
}
.cardback span{position:relative;z-index:1}

/* 盖面等待翻牌：结果先盖着，点一张翻一张 */
.rcard.closed{cursor:pointer;min-height:110px}
.rcell.closed{cursor:pointer;min-height:96px}
.rcard.closed .cardback,.rcell.closed .cardback{height:100%}
.rcell.closed .cardback{font-size:22px;min-height:96px}
.cb-pos{font-size:11px;font-weight:700;color:var(--cinnabar);letter-spacing:1px;text-align:center;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 补抽牌标记 */
.rcard.buibu-card{border-left:3px solid var(--gold)}
.jgcard.buibu-card{border-left:3px solid var(--gold)!important}
.buibu-tag{
  display:inline-block;font-size:10px;background:var(--gold);color:#fff;
  padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;letter-spacing:1px;
}

/* 正逆位 —— 不旋转，仅标"逆"字 */
.rev-tag{
  display:inline-block;font-size:10px;background:var(--ink2);color:#fff;
  padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;letter-spacing:1px;
}
.dong-tag{
  display:inline-block;font-size:10px;background:var(--jade);color:#fff;
  padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;letter-spacing:1px;
}
.dong-tag.bian{background:var(--cinnabar)}
.jgcard.rev-card .cn::after{content:' ↺';color:var(--ink2);font-size:10px}

/* 结果折叠：默认只显示牌名，点卡片展开象意 */
.rcard .rm{display:none}
.rcard.open .rm{display:block}
.cmcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.cmcard .cardhead{display:flex;align-items:baseline;gap:6px}
.cmcard .rnum{flex:0 0 24px;text-align:center;font-family:var(--serif);font-size:12px;color:var(--cinnabar);font-weight:700}
.cmcard .rn{flex:1;font-family:var(--serif);font-size:18px;font-weight:900;letter-spacing:2px}
.cmcard .rm{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.7;letter-spacing:.5px;text-align:left}
.cmcard .cm-mean{font-size:14px;font-weight:600;color:var(--ink);margin-top:5px;letter-spacing:.5px}
.dblk{display:flex;gap:8px;margin-top:7px;padding:7px 10px;border-radius:6px;font-size:12px;line-height:1.6;align-items:baseline}
.dblk-t{flex:0 0 auto;font-weight:700;letter-spacing:1px;font-family:var(--serif)}
.dblk-zheng{background:rgba(184,66,46,.08)}
.dblk-zheng .dblk-t{color:var(--cinnabar)}
.dblk-ni{background:rgba(74,122,102,.10)}
.dblk-ni .dblk-t{color:var(--jade)}
.dblk-lian{background:rgba(154,123,58,.10)}
.dblk-lian .dblk-t{color:var(--gold)}
.rcard{cursor:pointer}
.rcard:hover{border-color:var(--cinnabar)}
/* 牌意详解 */
.rd{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;line-height:1.85;color:var(--ink2);letter-spacing:.5px}
.dcard .rd{margin-top:6px;padding-top:6px;border-top:none}

/* 九宫格小牌也折叠 */
.jgcard .cm{display:none}
.jgcard.open .cm{display:block}
.jgcard{cursor:pointer}
.jgcard:hover{background:var(--panel2)}

/* 历史记录 */
.histlist{display:flex;flex-direction:column;gap:10px}
.histitem{
  background:var(--card);border:1px solid var(--cardline);border-radius:8px;padding:14px;
  cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(42,37,32,.06);
}
.histitem:hover{border-color:var(--cinnabar)}
.histitem .h-time{font-size:11px;color:var(--paper3);letter-spacing:1px}
.histitem .h-q{font-family:var(--serif);font-size:15px;font-weight:700;margin-top:4px;color:var(--ink)}
.histitem .h-meta{font-size:11px;color:var(--gold);margin-top:4px}
.histitem .h-preview{font-size:12px;color:var(--paper3);margin-top:6px;line-height:1.6}
/* 历史批量删除：管理模式下复选框 + 选中高亮 */
.histitem.manage{cursor:default}
.histitem.manage:hover{border-color:var(--cardline)}
.histitem .hcb{float:left;width:20px;height:20px;margin:2px 10px 0 0;border:1px solid var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--panel2)}
.histitem.sel{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar)}
.histitem.sel .hcb{background:var(--cinnabar);border-color:var(--cinnabar)}

/* 打印样式：无论暗色亮色一律浅色输出 */
@media print{
  html.dark{--bg:#fff;--bg2:#fff;--panel:#fff;--panel2:#f3f3f3;--paper:#000;--paper2:#222;--paper3:#444;--card:#fff;--cardline:#ccc;--ink:#000;--ink2:#444;--cinnabar:#b8422e;--cinnabar2:#cc5540;--gold:#9a7b3a;--jade:#4a7a66;--line:rgba(0,0,0,.15);--line2:rgba(0,0,0,.25)}
  body{background:#fff!important;color:#000!important}
  .wrap{max-width:100%;padding:0}
  nav,.panel,button,.resultops,#watermark,.footnote,.buibu{display:none!important}
  .result{margin:0}
  .rhead{color:#000;border-color:#000}
  .rhead .cardsline{color:#000}
  .rcard,.jgcell,.jgdetail,.rpos{box-shadow:none!important;border:1px solid #ccc!important;background:#fff!important;color:#000!important}
  .rrow{border-color:#ccc!important}
  .rrlab{color:#000!important;border-color:#ccc!important;background:#fff!important}
  .rcard .rm,.cmcard .rm,.jgcard .cm,.rpos .pm{color:#444!important}
  .rcard .rm,.cmcard .rm,.jgcard .cm{display:none!important}
  .mask{display:none!important}
}

@media (max-width:640px){
  .rrow{flex-direction:column;gap:8px}
  .rrow .rrlab{flex:0 0 auto;width:100%;padding:5px 0}
  .rrow .rcards .rcard{flex:1 1 45%}
  .wrap{padding:0 14px 60px}
  header{padding:24px 0 18px}
  .seal{width:44px;height:44px;font-size:25px}
  .ht h1{font-size:20px;letter-spacing:2px}
  nav button{font-size:14px;letter-spacing:4px;padding:9px 12px 11px}
  .cardgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .rpos{flex:0 0 100%}
  .rhead{flex-direction:column}
  .rhead .cardsline{font-size:18px}
  .rcards{gap:10px}
  .rcards .rcard{flex:1 1 45%}
  .rcard{padding:14px 10px}
  .rcard .rn{font-size:19px;letter-spacing:2px}
  .rcard .rm{font-size:12px}
  .jggrid{grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
  .jgcell{padding:8px}
  .jgcell .gn{font-size:14px}
  .jgcard{flex-direction:column;gap:2px}
  .jgcard .cm{text-align:left}
  .seg button{padding:7px 12px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="seal">爻</div>
  <div class="ht">
    <h1>万象牌</h1>
    <p>随安制作</p>
  </div>
  <button class="theme-btn" id="btnTheme" type="button">暗色</button>
</header>

<nav>
  <button class="on" data-view="draw">占卜</button>
  <button data-view="deck">牌面<span class="cnt" id="cntDeck">0</span></button>
  <button data-view="spread">牌阵</button>
  <button data-view="history">历史</button>
</nav>

<!-- ===== 视图：牌库 ===== -->
<section id="view-deck">
  <div class="panel">
    <h2>牌库管理<span class="hint">可建多个牌库，自由切换</span></h2>
    <div class="decktabs" id="deckTabs"></div>
    <div class="deckops">
      <details class="mini-menu">
        <summary>⋯</summary>
        <div class="menu">
          <button class="sm" id="btnRenameDeck">重命名当前库</button>
          <button class="sm danger" id="btnDelDeck">删除当前库</button>
          <button class="sm" id="btnExportDeck">导出当前库</button>
          <button class="sm" id="btnAddPreset">添加已有牌库</button>
          <button class="sm" id="btnImportDeck">导入牌库</button>
        </div>
      </details>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <details class="foldpanel" id="foldDeck" open>
    <summary>牌面</summary>
    <div class="foldbody">
    <div class="row" style="margin-bottom:14px">
      <div class="no-grow"><button class="sm" data-preset="lenormand">雷诺曼</button></div>
      <div class="no-grow"><button class="sm" data-preset="tarot">塔罗七十八牌</button></div>
            <div class="no-grow"><button class="sm" data-preset="sibilla">西比拉五十二牌</button></div>
<div class="no-grow"><button class="sm" data-preset="yijing">易经六十四卦</button></div>
      <div class="no-grow"><button class="sm" data-preset="oracle">星月神谕三十牌</button></div>
      <div class="no-grow"><button class="sm" data-preset="dizhi">十二地支</button></div>
      <div class="no-grow"><button class="sm danger" id="btnClearDeck">清空当前牌库</button></div>
      <div class="no-grow"><button class="sm" id="btnDeckView">列表</button></div>
      <div style="flex:1"></div>
    </div>
    <div class="cardgrid" id="cardGrid"></div>
    </div>
  </details>

  <details class="foldpanel" id="foldAdd">
    <summary>单张添加</summary>
    <div class="foldbody">
    <div class="row">
      <div class="grow2">
        <label>牌名</label>
        <input type="text" id="cardName" placeholder="如：书、星、钥匙">
      </div>
      <div>
        <label>序号（留空自动排）</label>
        <input type="number" id="cardNum" placeholder="1–36" min="1">
      </div>
    </div>
    <div style="margin-top:12px">
      <label>象意（正位 · 这张牌怎么读）</label>
      <textarea id="cardMean" placeholder="如：学问、隐秘、门路"></textarea>
    </div>
    <div style="margin-top:12px">
      <label>逆位象意（选填 · 不填则逆位用正位义）</label>
      <textarea id="cardMeanRev" placeholder="如：停滞、隐瞒、反方向"></textarea>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="no-grow"><button class="primary" id="btnAddCard">添加牌</button></div>
      <div class="no-grow"><button class="ghost" id="btnCancelEdit" style="display:none">取消</button></div>
      <div style="flex:1;text-align:right" class="muted" id="deckTip"></div>
    </div>
    </div>
  </details>

  <details class="foldpanel" id="foldBulk">
    <summary>批量添加</summary>
    <div class="foldbody">
    <label>粘贴牌列表（支持以下格式，每行一张）</label>
    <textarea id="bulkText" style="min-height:140px" placeholder="每行一张，支持格式：&#10;1. 书：学问、隐秘、门路&#10;星：明达、指引、希望之光&#10;月亮 情绪、暗面、直觉&#10;钥匙"></textarea>
    <div class="row" style="margin-top:12px">
      <div class="no-grow"><button class="primary" id="btnBulkImport">批量导入</button></div>
      <div class="no-grow"><button class="ghost sm" id="btnBulkAppend">追加到当前库</button></div>
      <div style="flex:1" class="muted">格式：序号可省略；牌名与象意之间用「：」或空格分隔</div>
    </div>
    </div>
  </details>
</section>

<!-- ===== 视图：牌阵 ===== -->
<section id="view-spread">
  <div class="panel">
    <h2>预设牌阵<span class="hint">点击选用，也可自行搭建</span></h2>
    <div class="spreadlist" id="presetList"></div>
  </div>
  <div class="panel">
    <h2>自建牌阵<span class="hint">位名：位义，一行一位；可设每排张数</span></h2>
    <div class="row">
      <div>
        <label>牌阵名</label>
        <input type="text" id="spName" placeholder="如：三才阵">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <label>行布局（每排张数，逗号分隔；留空=每行一张）</label>
        <input type="text" id="spRows" placeholder="如：3,3,3 或 1,3 或 4,4">
      </div>
      <div>
        <label>排标签（逗号分隔，可选）</label>
        <input type="text" id="spRowLabels" placeholder="如：2018,2019,2020">
      </div>
    </div>
    <div style="margin-top:12px">
      <label>牌位（每行一个：位名：位义，也可只写位名；数量=各行张数之和）</label>
      <textarea id="spPos" placeholder="过去：事之来由、前因&#10;现在：当下之局、主势&#10;未来：事之去向、结果"></textarea>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="no-grow"><button class="primary" id="btnAddSpread">添加牌阵</button></div>
      <div style="flex:1;text-align:right" class="muted">选中的牌阵会显示在占卜页</div>
    </div>
  </div>
  <div class="panel">
    <h2>自建牌阵列表</h2>
    <div class="row" style="margin-bottom:14px">
      <div class="no-grow"><button class="sm" id="btnExportSpreads">导出全部牌阵</button></div>
      <div class="no-grow"><button class="sm" id="btnImportSpreads">导入牌阵</button></div>
      <input type="file" id="importSpreadFile" accept=".json" style="display:none">
      <div style="flex:1"></div>
    </div>
    <div class="custlist" id="custList"></div>
    <div class="empty" id="custEmpty" style="display:none">还没有自建牌阵，先在上面搭一个</div>
  </div>
</section>

<!-- ===== 视图：占卜 ===== -->
<section id="view-draw" class="on">
  <div class="panel">
    <h2>起卦<span class="hint">心诚则灵，默念所问</span></h2>
    <div class="qinput">
      <div>
        <label>所问何事（可不填）</label>
        <input type="text" id="question" placeholder="如：这次考试能过吗？">
      </div>
    </div>

    <button class="drawbtn" id="btnDraw">抽　牌</button>

    <details class="drawsetup" id="drawSetup">
      <summary>抽牌设置</summary>
      <div class="qinput" style="margin-top:12px">
        <div>
          <label>使用牌库（可多选 · 排第一的为当前牌库）</label>
          <div id="deckPick" class="deckpick"></div>
        </div>
        <div>
          <label>选用牌阵</label>
          <div style="display:flex;gap:8px;align-items:center">
            <select id="spSelect"></select>
            <button type="button" class="sm" id="btnNewSpread" title="自己搭一个牌阵：起名、定位置">＋新建</button>
          </div>
        </div>
      </div>
      <div class="modebox" id="liuBox">
        <label>流年范围（年份，逐年一排）</label>
        <div class="row" style="margin-top:6px">
          <div><input type="number" id="liuFrom" placeholder="起始年，如 2018" min="1900" max="2200"></div>
          <div><input type="number" id="liuTo" placeholder="结束年，如 2023" min="1900" max="2200"></div>
        </div>
      </div>
      <div class="modebox" id="gongBox">
        <label>十二宫名（逗号分隔，可自定，每宫三张）</label>
        <textarea id="gongNames" rows="2">命宫,兄弟宫,夫妻宫,子女宫,财帛宫,疾厄宫,迁移宫,仆役宫,官禄宫,田宅宫,福德宫,相貌宫</textarea>
      </div>
      <div class="modebox" id="jgModeBox">
        <label>阴阳遁</label>
        <div class="seg" id="jgSeg">
          <button class="on" data-mode="yang">阳遁 · 顺布</button>
          <button data-mode="yin">阴遁 · 逆布</button>
        </div>
        <label style="margin-top:12px">落宫方式</label>
        <div class="seg" id="jgDistSeg" style="margin-top:6px">
          <button class="on" data-dist="feibu">飞布 · 按局数顺逆排</button>
          <button data-dist="random">随机 · 每宫四张随机落</button>
        </div>
        <div id="jgJuBox">
          <label>抽局（一至九局，或随机）</label>
          <div class="chips" id="jgChips"></div>
        </div>
      </div>
      <div class="modebox" id="dongBox">
        <label>动爻（易经卦适用）<span class="dong-hint">抽牌时可选动爻</span></label>
        <div class="seg" id="dongSeg" style="margin-top:6px">
          <button class="on" data-dong="normal">正常</button>
          <button data-dong="dong">动爻</button>
          <button data-dong="dufa">独发</button>
        </div>
      </div>
      <div class="optsrow">
        <label class="opt"><input type="checkbox" id="optAnim" checked> 翻牌动画</label>
        <label class="opt"><input type="checkbox" id="optSound"> 翻牌音效</label>
        <label class="opt"><input type="checkbox" id="optAuto"> 自动开牌</label>
      </div>
    </details>
  </div>
  <div class="result" id="result"></div>
</section>

<!-- ===== 视图：历史 ===== -->
<section id="view-history">
  <div class="panel">
    <h2>占卜历史<span class="hint">自动保存，点击回看</span></h2>
    <div class="row" style="margin-bottom:14px">
      <div class="no-grow"><button class="sm" id="btnManageHist">管理</button></div>
      <div class="no-grow"><button class="sm danger" id="btnDelSelHist" style="display:none">删除选中</button></div>
      <div style="flex:1"></div>
      <div class="no-grow"><button class="sm danger" id="btnClearHistory">清空历史</button></div>
    </div>
    <div class="histlist" id="histList"></div>
    <div class="empty" id="histEmpty">还没有占卜记录</div>
  </div>
  <div class="panel" id="histView" style="display:none">
    <h2>回看<span class="hint">历史记录详情</span></h2>
    <div id="histContent"></div>
  </div>
</section>

<footer class="footer"><div id="watermark">随安制作</div></footer>
</div>
<div class="mask" id="presetMask" style="display:none">
  <div class="about" role="dialog" aria-label="添加已有牌库">
    <button class="about-close" id="presetClose" type="button" aria-label="关闭">×</button>
    <h3>添加已有牌库</h3>
    <div id="presetPickList" style="display:flex;flex-direction:column;gap:10px;margin-top:14px"></div>
  </div>
</div>
<div class="mask" id="cardMask" style="display:none">
  <div class="about" role="dialog" aria-label="牌面详解" style="max-height:78vh;overflow:auto">
    <button class="about-close" id="cardClose" type="button" aria-label="关闭">×</button>
    <h3 id="cardModalTitle" style="font-family:var(--serif);color:var(--cinnabar)"></h3>
    <div id="cardPickList" style="display:flex;flex-direction:column;gap:12px;margin-top:14px"></div>
  </div>
</div>
<div class="mask" id="aboutMask" style="display:none">
  <div class="about" role="dialog" aria-label="关于">
    <button class="about-close" id="aboutClose" type="button" aria-label="关闭">×</button>
    <h3>关于</h3>
    <p class="about-tip">点击下方标识即可复制</p>
    <div class="about-item" data-copy="爻爻：kv1e422">
      <span class="about-key">爻爻</span>
      <span class="about-val">kv1e422</span>
      <span class="about-cpy">复制</span>
    </div>
    <div class="about-item" data-copy="随安：suiania">
      <span class="about-key">随安</span>
      <span class="about-val">suiania</span>
      <span class="about-cpy">复制</span>
    </div>
  </div>
</div>
<div id="toast"></div>
